name: Publicar boletines desde Drive

on:
  schedule:
    - cron: "17 * * * *"      # cada hora
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/publicar.yml", "tools/importar_drive.py", "tests/test_importar_drive.py"]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DRIVE_PENDIENTES: https://drive.google.com/drive/folders/13Pw4VkCwnX0TZXIQ5sDM1x_q33ZDBYkN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q gdown==6.4.2 markdown kokoro-onnx soundfile

      - name: Comprobar importador
        run: python -m unittest discover -s tests -p test_importar_drive.py

      - name: Descargar pendientes de Drive
        run: |
          python tools/importar_drive.py entrada --descargar

      - name: Importar números y generar audio
        run: python tools/importar_drive.py entrada

      - name: Construir el sitio
        run: python build.py

      - name: Publicar
        run: |
          rm -rf entrada kokoro-v1.0.onnx voices-v1.0.bin
          git config user.name "Publicador de boletines"
          git config user.email "julioe.castillomercedes@gmail.com"
          git add -A issues audio guiones docs
          if git diff --cached --quiet; then echo "Nada nuevo que publicar"; exit 0; fi
          git commit -q -m "Publicación automática: $(git diff --cached --name-only -- issues audio guiones | xargs -n1 basename | tr '\n' ' ')"
          git push -q origin HEAD:main
